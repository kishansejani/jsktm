<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JSK Tex Mech Pvt. Ltd. — cost-effective, technologically advanced yarn winding machinery and spares manufactured in Gujarat, India." />
    <meta name="theme-color" content="#070d1f" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('jsk-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>JSK Tex Mech — Yarn Winding Machinery</title>
  <style>
      #boot{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:26px;background:#070d1f;transition:opacity .5s ease,visibility .5s}
      [data-theme='light'] #boot{background:#f4f7ff}
      #boot.hide{opacity:0;visibility:hidden}
      #boot .boot-logo{background:#fff;border-radius:22px;padding:14px 20px;box-shadow:0 20px 50px -18px rgba(47,107,255,.55);animation:bootPulse 1.6s ease-in-out infinite}
      #boot img{display:block;width:min(220px,56vw);height:auto}
      #boot .boot-bar{width:min(180px,48vw);height:4px;border-radius:4px;background:rgba(120,150,220,.25);overflow:hidden;position:relative}
      #boot .boot-bar::after{content:'';position:absolute;inset:0;width:45%;border-radius:4px;background:linear-gradient(90deg,#0fb5ab,#2f6bff,#902888,#e84030,#f09838);animation:bootBar 1.1s ease-in-out infinite}
      @keyframes bootBar{0%{transform:translateX(-110%)}100%{transform:translateX(250%)}}
      @keyframes bootPulse{50%{transform:scale(1.04)}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="boot-logo"><img src="/mobilelogo.png" alt="" /></div><span class="boot-bar"></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
